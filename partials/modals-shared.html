<!-- ═══════════════════════════════════════════════════
     SHARED MODALS (not tied to a single tab)
     ═══════════════════════════════════════════════════ -->

<!-- TITLE / SETTINGS MODAL -->
<div class="mo" id="moTitle" style="display:none;" onclick="if(event.target===this)closeMo('moTitle')">
  <div class="mb" style="max-width:480px;">
    <h3>Schedule Title &amp; Settings</h3>
    <div class="msub">Set a title and subtitle shown on Setup and Schedule tabs.</div>
    <label>Title</label>
    <input type="text" id="schedTitle" placeholder="e.g. Volunteer Schedule — April 2025">
    <label>Subtitle / Organization</label>
    <input type="text" id="schedSubtitle" placeholder="e.g. First Church AV Team">
    <div class="sec-hd" style="margin-top:4px;">Day Labels (optional)</div>
    <p style="font-size:11px;color:var(--tx3);margin-bottom:9px;">
      Add a custom label to any specific date. These appear on the calendar.
    </p>
    <div id="dayLabelList" style="margin-bottom:7px;max-height:200px;overflow-y:auto;"></div>
    <div class="row" style="align-items:flex-end;gap:7px;">
      <div style="flex:0 0 130px;">
        <label style="margin-bottom:3px;">Date</label>
        <input type="date" id="dlDate" style="margin-bottom:0;">
      </div>
      <div style="flex:1;">
        <label style="margin-bottom:3px;">Label</label>
        <input type="text" id="dlLabel" placeholder="e.g. Easter Sunday" style="margin-bottom:0;">
      </div>
      <button class="btn sm pri" onclick="addDayLabel()" style="flex:0 0 auto;margin-bottom:0;">+ Add</button>
    </div>
    <div class="mac">
      <div style="flex:1;"></div>
      <button class="btn sm" onclick="closeMo('moTitle')">Cancel</button>
      <button class="btn sm pri" onclick="saveTitleSettings()">Save</button>
    </div>
  </div>
</div>
